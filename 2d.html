<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dplane | Módulo 2D</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="top-bar">
        <h1><span>dplane</span> <span class="subtitle">Módulo 2D (Sandbox)</span></h1>
        
        <div class="diagnostic-badge">
            <span>Iterações:</span> <span id="iterations-value">Desenhando...</span>
        </div>
    </header>

    <main class="dashboard">
        <!-- Painel de Controles Lateral -->
        <aside class="control-panel">
            <div class="control-group">
                <label>Modelo Dinâmico 2D</label>
                <select id="model-select"></select>
            </div>

            <div class="control-group">
                <label>Condição Inicial (x₀)</label>
                <div class="input-row">
                    <input type="range" id="x0-slider" min="-20" max="20" step="0.1">
                    <input type="number" id="x0-input" step="0.1">
                </div>
            </div>

            <div class="control-group">
                <label>Condição Inicial (y₀)</label>
                <div class="input-row">
                    <input type="range" id="y0-slider" min="-20" max="20" step="0.1">
                    <input type="number" id="y0-input" step="0.1">
                </div>
            </div>

            <div id="sliders-container" class="sliders-container">
                <!-- Sliders dos parâmetros 2D entrarão aqui -->
            </div>
        </aside>
<!-- Área dos Gráficos -->
        <!-- Área dos Gráficos -->
        <section class="plots-area" style="grid-template-columns: 1fr;">
            
            <div class="plot-card full-width" style="height: 60vh; display: flex; flex-direction: column;">
                <h2>Plano de Fases (Phase Plane)</h2>
                <!-- Adicionado flex: 1 para forçar o canvas a preencher todo o espaço vazio -->
                <canvas id="phase-plane-canvas" style="flex: 1; width: 100%;"></canvas>
            </div>
            
            <div class="plot-card full-width" style="height: 30vh; display: flex; flex-direction: column;">
                <h2>Série Temporal (X e Y vs n)</h2>
                <!-- Adicionado flex: 1 aqui também -->
                <canvas id="timeseries-2d-canvas" style="flex: 1; width: 100%;"></canvas>
            </div>
            
        </section>
    </main>

    <!-- O motor do 2D que vamos criar a seguir -->
    <script type="module" src="js/app-2d.js"></script>
</body>
</html>
